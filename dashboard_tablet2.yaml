    empty_day_text: –
    language: de
    show_past_events: true
    filter_duplicates: true
    today_indicator: dot
    today_indicator_color: '#4FB3A9'
    weekday_font_size: 14px
    day_font_size: 30px
    month_font_size: 13px
    event_font_size: 18px
    time_font_size: 14px
    location_font_size: 13px
    time_icon_size: 14px
    location_icon_size: 14px
    vertical_line_width: 4px
    event_background_opacity: 12
    day_spacing: 14px
    event_spacing: 6px
    day_separator_width: 1px
    day_separator_color: var(--divider-color)
    show_location: true
    show_end_time: true
    time_24h: true
    accent_color: '#81C784'
    weather:
      entity: weather.forecast_home
      position: date
      date:
        show_conditions: true
        show_high_temp: true
        show_low_temp: true
        icon_size: 18px
        font_size: 13px
    card_mod:
      style: 'ha-card { height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; }'
    view_layout:
      grid-area: plan
    event_tap_action:
      action: details
  - type: todo-list
    entity: todo.einkaufsliste
    title: Einkaufsliste
    hide_completed: false
    display_order: duedate_asc
    card_mod:
      style:
        .: 'ha-card { height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: none; border-top: 6px solid #81C784; box-sizing: border-box; } ha-checkbox { --mdc-checkbox-unchecked-color: #81C784; --mdc-theme-secondary: #81C784; } ha-input, ha-textfield { min-width: 0 !important; flex: 1 1 0 !important; width: auto !important; }'
        ha-card$: '.card-header { font-size: 22px !important; padding-bottom: 4px !important; }'
    view_layout:
      grid-area: shop
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
    # erscheint erst, wenn das Paket aus Teil 2 installiert ist
    - type: conditional
      conditions:
      - entity: script.familienplaner_liste_drucken
        state_not: unavailable
      chip:
        type: template
        icon: mdi:printer
        icon_color: teal
        content: Drucken
        tap_action:
          action: perform-action
          perform_action: script.familienplaner_liste_drucken
          data:
            liste: einkauf
            status: input_text.familienplaner2_status
          confirmation:
            text: Einkaufsliste jetzt ausdrucken?
    # erscheint erst, wenn das Paket aus Teil 2 installiert ist
    - type: conditional
      conditions:
      - entity: script.familienplaner_liste_senden
        state_not: unavailable
      chip:
        type: template
        icon: mdi:send
        icon_color: blue
        content: Telegram
        tap_action:
          action: perform-action
          perform_action: script.familienplaner_liste_senden
          data:
            liste: einkauf
            status: input_text.familienplaner2_status
          confirmation:
            text: Einkaufsliste jetzt per Telegram schicken?
    card_mod:
      style: 'ha-card { --chip-height: 44px; --chip-font-size: 15px; --chip-icon-size: 20px; --chip-spacing: 10px; --chip-padding: 0 16px; }'
    view_layout:
      grid-area: shopbar
  - type: vertical-stack
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Essen eintragen
        icon: mdi:pot-steam
        heading_style: title
        card_mod:
          style: 'ha-card { --mdc-icon-size: 26px; padding: 4px 4px 0; } ha-state-icon, ha-icon { color: #81C784; }'
      - type: entities
        card_mod:
          style: 'ha-card { padding: 4px 0; } :host { --mdc-typography-body1-font-size: 17px; }'
        entities:
        - entity: input_datetime.familienplaner2_essen_datum
          name: ' '
        - entity: input_select.familienplaner2_essen_mahlzeit
          name: Mahlzeit
        - entity: input_text.familienplaner2_essen_gericht
          name: Gericht
      - type: button
        name: Essen eintragen
        icon: mdi:pot-steam
        show_name: true
        show_icon: false
        tap_action:
          action: perform-action
          perform_action: script.familienplaner2_essen_speichern
        card_mod:
          style: 'ha-card { background: #81C784; border-radius: 16px; padding: 14px 0 !important; flex-direction: row !important; justify-content: center !important; gap: 12px; } ha-card span { font-size: 18px; font-weight: 600; color: #10151a; width: auto !important; flex: 0 0 auto !important; } ha-state-icon { color: #10151a !important; }'
      - type: markdown
        content: Nach dem Speichern springt der Tag automatisch weiter – so ist die ganze Woche schnell geplant.
        card_mod:
          style:
            .: 'ha-card { background: transparent; }'
            ha-markdown$: 'p { font-size: 14px !important; color: var(--secondary-text-color); }'
    - type: conditional
      conditions:
      - condition: state
        entity: input_text.familienplaner2_status
        state_not:
        - ''
        - unknown
        - unavailable
      card:
        type: markdown
        content: '{{ states(''input_text.familienplaner2_status'') }}'
        card_mod:
          style:
            .: 'ha-card { background: var(--fz-active); }'
            ha-markdown$: 'p { font-size: 16px !important; margin: 0 !important; }'
    view_layout:
      grid-area: todo
- title: Eintragen
  path: eintragen
  icon: mdi:plus-circle
  theme: Familienplaner
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr)
    grid-template-rows: 100%
    grid-template-areas: '"termin vorschau"'
    grid-gap: 12px
    margin: '0'
    padding: 12px 12px 12px 0
    height: calc(100vh - 24px)
  cards:
  - type: vertical-stack
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Neuer Termin
        icon: mdi:calendar-plus
        heading_style: title
        card_mod:
          style: 'ha-card { --mdc-icon-size: 26px; padding: 4px 4px 0; } ha-state-icon, ha-icon { color: var(--primary-color); }'
      - type: entities
        state_color: true
        card_mod:
          style: 'ha-card { padding: 4px 0; } :host { --mdc-typography-body1-font-size: 17px; }'
        entities:
        - entity: input_select.familienplaner2_termin_kalender
          name: Für
        - entity: input_text.familienplaner2_termin_titel
          name: Was?
        - entity: input_datetime.familienplaner2_termin_datum
          name: Datum
        - entity: input_boolean.familienplaner2_termin_ganztaegig
          name: Ganztägig
        - type: conditional
          conditions:
          - entity: input_boolean.familienplaner2_termin_ganztaegig
            state: 'off'
          row:
            entity: input_datetime.familienplaner2_termin_von
            name: Beginn
        - type: conditional
          conditions:
          - entity: input_boolean.familienplaner2_termin_ganztaegig
            state: 'off'
          row:
            entity: input_datetime.familienplaner2_termin_bis
            name: Ende
        - entity: input_text.familienplaner2_termin_ort
          name: Ort (optional)
      - type: button
        name: Termin speichern
        icon: mdi:calendar-check
        show_name: true
        show_icon: false
        tap_action:
          action: perform-action
          perform_action: script.familienplaner2_termin_speichern
        card_mod:
          style: 'ha-card { background: #4FB3A9; border-radius: 16px; padding: 14px 0 !important; flex-direction: row !important; justify-content: center !important; gap: 12px; } ha-card span { font-size: 18px; font-weight: 600; color: #10151a; width: auto !important; flex: 0 0 auto !important; } ha-state-icon { color: #10151a !important; }'
    - type: conditional
      conditions:
      - condition: state
        entity: input_text.familienplaner2_status
        state_not:
        - ''
        - unknown
        - unavailable
      card:
        type: markdown
        content: '{{ states(''input_text.familienplaner2_status'') }}'
        card_mod:
          style:
            .: 'ha-card { background: var(--fz-active); }'
            ha-markdown$: 'p { font-size: 16px !important; margin: 0 !important; }'
    - type: markdown
      content: <ha-icon icon="mdi:gesture-tap"></ha-icon> **Ändern oder löschen:** unter *Kalender* einfach auf den Eintrag tippen.
      card_mod:
        style:
          .: 'ha-card { background: transparent; }'
          ha-markdown$: 'p { font-size: 14px !important; color: var(--secondary-text-color); } ha-icon { --mdc-icon-size: 18px; vertical-align: -3px; }'
    - type: custom:mushroom-template-card
      primary: Essen eintragen?
      secondary: Das geht jetzt auf der Seite „Essen“
      icon: mdi:silverware-fork-knife
      icon_color: green
      multiline_secondary: true
      fill_container: true
      badge_icon: mdi:chevron-right
      badge_color: grey
      tap_action:
        action: navigate
        navigation_path: /familienplaner-tablet2/essen?hide_header
      card_mod:
        style: 'ha-card { padding: 10px 14px !important; } ha-tile-icon { --tile-icon-size: 48px; --mdc-icon-size: 28px; } ha-tile-info { --ha-tile-info-primary-font-size: 18px; --ha-tile-info-primary-line-height: 24px; --ha-tile-info-secondary-font-size: 14px; --ha-tile-info-secondary-line-height: 19px; }'
    view_layout:
      grid-area: termin
  - type: custom:calendar-card-pro
    title: Kommende Einträge
    title_font_size: 22px
    entities:
    - entity: calendar.familie
      color: var(--primary-text-color)
      accent_color: '#4FB3A9'
      label: mdi:home-heart
    - entity: calendar.mama
      color: var(--primary-text-color)
      accent_color: '#F06292'
      label: mdi:account-heart
    - entity: calendar.papa
      color: var(--primary-text-color)
      accent_color: '#5C9DFF'
      label: mdi:account-tie
    - entity: calendar.mia
      color: var(--primary-text-color)
      accent_color: '#B388FF'
      label: mdi:star-face
    - entity: calendar.leo
      color: var(--primary-text-color)
      accent_color: '#FFB74D'
      label: mdi:school
    - entity: calendar.essensplan
      color: var(--primary-text-color)
      accent_color: '#81C784'
      label: mdi:silverware-fork-knife
    days_to_show: 14
    show_empty_days: false
    empty_day_text: –
    language: de
    show_past_events: true
    filter_duplicates: true
    today_indicator: dot
    today_indicator_color: '#4FB3A9'
    weekday_font_size: 14px
    day_font_size: 30px
    month_font_size: 13px
    event_font_size: 18px
    time_font_size: 14px
    location_font_size: 13px
    time_icon_size: 14px
    location_icon_size: 14px
    vertical_line_width: 4px
    event_background_opacity: 12
    day_spacing: 14px
    event_spacing: 6px
    day_separator_width: 1px
    day_separator_color: var(--divider-color)
    show_location: true
    show_end_time: true
    time_24h: true
    accent_color: '#4FB3A9'
    weather:
      entity: weather.forecast_home
      position: date
      date:
        show_conditions: true
        show_high_temp: true
        show_low_temp: true
        icon_size: 18px
        font_size: 13px
    card_mod:
      style: 'ha-card { height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; }'
    view_layout:
      grid-area: vorschau
    event_tap_action:
      action: details
- title: Kalender
  path: monat
  icon: mdi:calendar-month
  theme: Familienplaner
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr)
    grid-template-rows: auto minmax(0, 1fr)
    grid-template-areas: '"top" "main"'
    grid-gap: 12px
    margin: '0'
    padding: 12px 12px 12px 0
    height: calc(100vh - 24px)
  cards:
  - type: custom:mushroom-chips-card
    alignment: start
    chips:
    - type: template
      icon: mdi:calendar-week
      content: Woche
      icon_color: grey
      tap_action:
        action: navigate
        navigation_path: /familienplaner-tablet2/woche?hide_header
    - type: template
      icon: mdi:calendar-month
      content: Monat
      icon_color: teal
      tap_action:
        action: none
    card_mod:
      style: 'ha-card { --chip-height: 40px; --chip-font-size: 15px; --chip-icon-size: 20px; --chip-spacing: 10px; --chip-padding: 0 16px; }'
    view_layout:
      grid-area: top
  - type: calendar
    initial_view: dayGridMonth
    entities:
    - calendar.familie
    - calendar.mama
    - calendar.papa
    - calendar.mia
    - calendar.leo
    - calendar.essensplan
    view_layout:
      grid-area: main
    card_mod:
      style:
        .: 'ha-card { height: 100%; overflow: hidden; box-sizing: border-box; }'
        ha-full-calendar$: '#calendar { height: calc(100vh - 120px) !important; } .fc { height: 100% !important; } .fc-event-title, .fc-event-time { font-size: 14px; }'
  subview: true
  back_path: /familienplaner-tablet2/woche?hide_header
